spring.application.name=vibe-boot
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
vibeboot.encryption-key=${VIBEBOOT_ENCRYPTION_KEY}
vibeboot.github.client-id=${GITHUB_CLIENT_ID}
vibeboot.github.client-secret=${GITHUB_CLIENT_SECRET}
vibeboot.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/auth/github/callback}
vibeboot.github.authorization-uri=${GITHUB_AUTHORIZATION_URI:https://github.com/login/oauth/authorize}
vibeboot.github.scope=${GITHUB_SCOPE:read:user,user:email}
